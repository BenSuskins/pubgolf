# Copied from BenSuskins/repo-templates for use by this public repository.
name: Security scan (reusable)

on:
  workflow_call:
    inputs:
      languages:
        description: |
          JSON array of CodeQL language configs. Each entry must have `language`
          and `build-mode` (one of `autobuild`, `manual`, `none`).
          Example: '[{"language":"go","build-mode":"manual"},{"language":"javascript-typescript","build-mode":"none"}]'
        required: true
        type: string
      manual-build-command:
        description: Shell command to run when `build-mode` is `manual`. Receives `$LANGUAGE` env var.
        required: false
        type: string
        default: ''
      manual-build-working-directory:
        description: Working directory for the manual build command.
        required: false
        type: string
        default: '.'
      go-version:
        description: Go toolchain version to install when a `go` language entry is present. Empty to skip.
        required: false
        type: string
        default: ''
      go-cache-dependency-path:
        description: Path to `go.sum` for `actions/setup-go` cache.
        required: false
        type: string
        default: ''

permissions:
  security-events: write
  packages: read
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-latest' || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.languages) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        if: matrix.language == 'go' && inputs.go-version != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}
          cache-dependency-path: ${{ inputs.go-cache-dependency-path }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Manual build
        if: matrix.build-mode == 'manual' && inputs.manual-build-command != ''
        shell: bash
        working-directory: ${{ inputs.manual-build-working-directory }}
        env:
          LANGUAGE: ${{ matrix.language }}
          BUILD_COMMAND: ${{ inputs.manual-build-command }}
        run: |
          # shellcheck disable=SC2086
          eval "$BUILD_COMMAND"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
