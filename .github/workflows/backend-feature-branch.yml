name: Verify Backend
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'makefile'
      - '.github/workflows/backend*.yml'
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/verify-go.yml
    with:
      go-version: '1.27.3'
      working-directory: apps/backend
      test-command: go test -race ./...
      pre-test-commands: |
        go run ./cmd/openapi -check
        test -z "$(gofmt -l cmd internal)"
        go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run
  openapi:
    uses: ./.github/workflows/verify-openapi.yml
    with:
      spec-path: apps/backend/internal/adapters/httpapi/openapi.json
  container:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-container.yml
    with:
      image: ghcr.io/bensuskins/pubgolf-backend
      context: ./apps/backend
      tags: ${{ github.sha }}
      push: false
