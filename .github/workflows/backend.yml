name: Build & Push Backend Image
on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'makefile'
      - '.github/workflows/backend*.yml'
permissions:
  contents: read
jobs:
  verify:
    uses: bensuskins/repo-templates/.github/workflows/verify-go.yml@main
    with:
      go-version: '1.25'
      working-directory: apps/backend
      test-command: go test -race ./...
      pre-test-commands: test -z "$(gofmt -l cmd internal)"
  openapi:
    uses: bensuskins/repo-templates/.github/workflows/verify-openapi.yml@main
    with:
      spec-path: apps/backend/internal/adapters/httpapi/openapi.json
  publish:
    needs: [verify, openapi]
    permissions:
      contents: read
      packages: write
    uses: bensuskins/repo-templates/.github/workflows/publish-container.yml@main
    with:
      image: ghcr.io/bensuskins/pubgolf-backend
      context: ./apps/backend
      tags: |
        latest
        ${{ github.sha }}
