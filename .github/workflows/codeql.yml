name: CodeQL Advanced
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 14 * * 2'
permissions:
  security-events: write
  packages: read
  actions: read
  contents: read
jobs:
  analyze:
    uses: ./.github/workflows/security-scan.yml
    with:
      languages: '[{"language":"actions","build-mode":"none"},{"language":"go","build-mode":"manual"},{"language":"javascript-typescript","build-mode":"none"}]'
      go-version: '1.27.3'
      go-cache-dependency-path: apps/backend/go.sum
      manual-build-working-directory: apps/backend
      manual-build-command: go build ./...
